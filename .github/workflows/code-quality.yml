name: code quality
on:
  workflow_call:

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Or use node-version-file: '.nvmrc'
          cache: 'npm' # Change to 'yarn' or 'pnpm' if needed

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
    