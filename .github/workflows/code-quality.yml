name: code quality
on: 
  workflow_call:

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
        - name: checkout code
          uses: actions/checkout@v7

        - name: setup node
          uses: actions/setup-node@v6
          with:
            node-version: 20

        - name: Install dependencies
          run: npm ci

        - name: Install npm Packages
          run: npm install --legacy-peer-deps

        - name: Check formatting
          run: npm run format:check

        - name: Run linter
          run: npm run lint