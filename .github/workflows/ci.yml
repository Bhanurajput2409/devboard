#Goal - Create CI piepeline and push to docker hub  

name: CI Github Actions
on:
  push:
    branches: [master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
    - name: checkout the code
      uses: actions/checkout@v6
      
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

     # Step 3: Install clean dependencies
    - name: Install dependencies
      run: npm install --install-links --legacy-peer-deps
      working-directory: ./frontend 

    - run: npm test
      working-directory: ./frontend
    
    - name: lint the code
      run: npm run lint
      working-directory: ./frontend

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-frontend:latest
    
  Backend:
    runs-on: ubuntu-latest
    steps:
    - name: checkout the code
      uses: actions/checkout@v6
      
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.23
        go-version-file: ./backend/go.mod
        cache-dependency-path: ./backend/go.sum

    - name: run go vet 
      run: go vet
      working-directory: ./backend

    - name: run go test
      run: go test ./...
      working-directory: ./backend

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-backend:latest
      
