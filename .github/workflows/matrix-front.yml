# Goal install mutliple versions of node and linting

name: Node linter

on:
    workflow_dispatch:

jobs:
    code-linting:
        runs-on: ubuntu:26
        strategy:
            fail-fast: false
            matrix:
                node: ['18','20','22']

        steps:
          - name: checkout the code
            uses: actions/checkout@v6

          - name: setup node.js
            uses: actions/setup-node@v7
            with:
                node-version: ${{ matrix.node }}
                cache: 'npm'
                cache-dependency-path: frontend/package-lock.json

          - run: npm test
            working-directory: ./frontend
          
          - name: lint the code
            run: npm run lint
            working-directory: ./frontend

